# The contract harness. `wrangler dev` runs it locally (workerd and a local
# D1), so no Cloudflare account is needed.
name = "tarodomain-contract-harness"
main = "build/worker/shim.mjs"
compatibility_date = "2025-11-01"

[build]
command = "cargo install -q worker-build && worker-build --release"

[[d1_databases]]
binding = "DB"
database_name = "tarodomain-contract"
# Only used by `wrangler dev`, which keeps the database on disk.
database_id = "00000000-0000-0000-0000-000000000000"

[[queues.producers]]
binding = "EVENTS"
queue = "tarodomain-contract-events"
