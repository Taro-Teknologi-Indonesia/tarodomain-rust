[package]
name = "cloudflare-contract-harness"
description = "A Worker that runs the tarodomain-testing contract suites against D1 inside workerd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# The Worker only exists on wasm32. Natively this crate is empty, so
# `cargo test --workspace` still builds.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
tarodomain.workspace = true
tarodomain-cloudflare.workspace = true
tarodomain-testing.workspace = true
worker.workspace = true

[lints]
workspace = true
