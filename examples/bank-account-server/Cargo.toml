[package]
name = "bank-account-server"
description = "The bank example served over HTTP with axum on SQLite"
version.workspace = true
edition.workspace = true
rust-version = "1.94"
license.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true, features = ["json"] }
bank-account.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["sqlite"] }
tarodomain.workspace = true
tracing.workspace = true
tarodomain-axum.workspace = true
tarodomain-sqlx = { workspace = true, features = ["sqlite"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

[lints]
workspace = true
